name: Release

# 每次推送 v* 标签：按标签指向的提交构建、先跑单测、再写版本资源并打包发布 GitHub Release。
# 手动触发（workflow_dispatch）需要填一个已存在的标签名，检出与构建都使用该标签。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '要构建的标签，例如 v0.2.5'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TOOLCHAIN_CACHE_KEY: winlibs-16.2.0posix-23.1.3-14.0.0-ucrt-r3

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      INPUT_VERSION: ${{ inputs.version }}

    steps:
      - name: Checkout (tag being released)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # 工具链压缩包 264MB，缓存后重复运行不再走 GitHub API（也避开未认证限流）。
      - name: Cache MinGW toolchain archive
        uses: actions/cache@v6
        with:
          path: .toolchain/download
          key: ${{ env.TOOLCHAIN_CACHE_KEY }}

      - name: Resolve version from tag
        id: version
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF.Substring('refs/tags/'.Length) } else { $env:INPUT_VERSION }
          if ([string]::IsNullOrWhiteSpace($tag)) { throw '没有标签引用；手动运行时必须提供 version 输入。' }
          $ver = $tag -replace '^v', ''
          if ($ver -notmatch '^\d+\.\d+\.\d+$') { throw "标签 '$tag' 必须形如 vX.Y.Z" }
          # 手动触发时也确保 build 的是标签提交，而不是分支 HEAD。
          $head = (git rev-parse HEAD).Trim()
          $tagCommit = (git rev-parse "$tag^{commit}").Trim()
          if ($head -ne $tagCommit) { throw "检出提交 $head 与标签 $tag 指向的 $tagCommit 不一致。" }
          "tag=$tag"        >> $env:GITHUB_OUTPUT
          "version=$ver"    >> $env:GITHUB_OUTPUT
          Write-Host "tag=$tag version=$ver commit=$head"

      # 单一版本来源是标签：把版本写进 exe 资源、清单与包内 README，
      # 这样任何一个 v* 标签都能产出与标签一致的二进制。
      - name: Stamp version into resources
        shell: pwsh
        env:
          VER: ${{ steps.version.outputs.version }}
        run: |
          $ver    = $env:VER
          $p      = $ver.Split('.')
          $quad   = '{0},{1},{2},0' -f $p[0], $p[1], $p[2]
          $dotted = "$ver.0"
          $utf8   = New-Object System.Text.UTF8Encoding($false)

          $rc = [IO.File]::ReadAllText('assets/app.rc', [Text.Encoding]::UTF8)
          $rc = $rc -replace '(?m)^FILEVERSION\s+[\d,]+',    ('FILEVERSION     ' + $quad)
          $rc = $rc -replace '(?m)^PRODUCTVERSION\s+[\d,]+', ('PRODUCTVERSION  ' + $quad)
          $rc = $rc -replace '("FileVersion",\s*")[\d.]+"',    ('${1}' + $dotted + '"')
          $rc = $rc -replace '("ProductVersion",\s*")[\d.]+"', ('${1}' + $dotted + '"')
          [IO.File]::WriteAllText('assets/app.rc', $rc, $utf8)

          $vh = [IO.File]::ReadAllText('src/app/version.h', [Text.Encoding]::UTF8)
          $vh = $vh -replace '(kAppVersion\[\]\s*=\s*L")[^"]*"', ('${1}' + $ver + '"')
          [IO.File]::WriteAllText('src/app/version.h', $vh, $utf8)

          $mf = [IO.File]::ReadAllText('assets/app.manifest', [Text.Encoding]::UTF8)
          $mf = $mf -replace '(name="lume\.launcher"\s+version=")[^"]*"', ('${1}' + $dotted + '"')
          [IO.File]::WriteAllText('assets/app.manifest', $mf, $utf8)

          $pk = [IO.File]::ReadAllText('packaging/README.txt', [Text.Encoding]::UTF8)
          $pk = $pk -replace '(?m)^Lume\s+[\d.]+', ('Lume ' + $ver)
          $pk = $pk -replace '(版本：Lume )[\d.]+', ('${1}' + $ver)
          [IO.File]::WriteAllText('packaging/README.txt', $pk, $utf8)

          # build.ps1 的 -Version 默认值也跟随标签；保留 UTF-8 BOM，PS 5.1 才能正确解析中文。
          $bp = [IO.File]::ReadAllText('build.ps1', [Text.Encoding]::UTF8)
          $bp = $bp -replace '(?m)\[string\]\$Version = ''[^'']*''', ('[string]$Version = ''' + $ver + "'")
          [IO.File]::WriteAllText('build.ps1', $bp, (New-Object System.Text.UTF8Encoding($true)))

          git --no-pager diff --stat

      # 防止「改了版本号但漏了某处」：戳完之后所有版本字面量必须与标签一致。
      - name: Verify stamped versions
        shell: pwsh
        env:
          VER: ${{ steps.version.outputs.version }}
        run: |
          $ver = $env:VER
          $dotted = "$ver.0"
          $p = $ver.Split('.')
          $quad = '{0},{1},{2},0' -f $p[0], $p[1], $p[2]
          $checks = @(
            @{ Path = 'src/app/version.h';       Text = 'L"' + $ver + '"' },
            @{ Path = 'assets/app.rc';           Text = 'FILEVERSION     ' + $quad },
            @{ Path = 'assets/app.rc';           Text = '"' + $dotted + '"' },
            @{ Path = 'assets/app.manifest';     Text = 'version="' + $dotted + '"' },
            @{ Path = 'build.ps1';               Text = "'" + $ver + "'" },
            @{ Path = 'packaging/README.txt';    Text = 'Lume ' + $ver },
            @{ Path = 'packaging/README.txt';    Text = '版本：Lume ' + $ver + '。' }
          )
          foreach ($check in $checks) {
            if (-not (Select-String -LiteralPath $check.Path -SimpleMatch $check.Text -Quiet)) {
              throw "版本不一致：$($check.Path) 里找不到 '$($check.Text)'"
            }
          }
          Write-Host "version consistency: OK ($ver)"

      - name: Fetch portable MinGW-w64 toolchain
        shell: pwsh
        run: |
          node tools/fetch-toolchain.mjs
          Expand-Archive -LiteralPath .toolchain/download/winlibs.zip -DestinationPath .toolchain -Force
          if (-not (Test-Path '.toolchain/mingw64/bin/g++.exe')) { throw 'MinGW 解压失败' }
          (& '.toolchain/mingw64/bin/g++.exe' --version) | Select-Object -First 1

      - name: Run unit tests
        shell: pwsh
        run: |
          # 运行器默认执行策略可能拦脚本；作用域仅限本步骤进程。
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          ./build.ps1 -Config Test

      - name: Build release package
        shell: pwsh
        env:
          VER: ${{ steps.version.outputs.version }}
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          ./build.ps1 -Config Release -Package -Version $env:VER

      - name: Smoke test CLI and package contents
        shell: pwsh
        env:
          VER: ${{ steps.version.outputs.version }}
        run: |
          cmd /c "build\Lume.exe --version > build\version.txt 2>&1"
          if (-not (Select-String -Path 'build\version.txt' -Pattern ('^Lume ' + [regex]::Escape($env:VER) + '$') -Quiet)) {
            throw '--version 冒烟失败（输出与标签版本不一致）'
          }
          $stage = "dist\Lume-$($env:VER)-win64"
          if (-not (Test-Path "$stage\Lume.exe")) { throw "缺少 $stage\Lume.exe" }
          if (-not (Select-String -LiteralPath "$stage\README.txt" -SimpleMatch ('版本：Lume ' + $env:VER + '。') -Quiet)) {
            throw '包内 README 版本与标签不一致'
          }
          if (-not (Select-String -LiteralPath "$stage\README.txt" -SimpleMatch 'Install.cmd' -Quiet)) {
            throw '包内 README 缺少安装说明'
          }
          Write-Host "package smoke: OK"

      - name: Write checksums
        shell: pwsh
        env:
          VER: ${{ steps.version.outputs.version }}
        run: |
          $name = "Lume-$($env:VER)-win64.zip"
          $zip  = Join-Path 'dist' $name
          if (-not (Test-Path $zip)) { throw "缺少发布包 $zip" }
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content -LiteralPath 'dist/SHA256SUMS.txt' -Encoding ascii
          Get-Content -LiteralPath 'dist/SHA256SUMS.txt'
          Write-Host ("size: {0:N1} KB" -f ((Get-Item $zip).Length / 1KB))

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: Lume-${{ steps.version.outputs.version }}-win64
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub release
        shell: pwsh
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VER: ${{ steps.version.outputs.version }}
        run: |
          $assets = @(
            (Resolve-Path "dist/Lume-$($env:VER)-win64.zip").Path
            (Resolve-Path 'dist/SHA256SUMS.txt').Path
          )

          # 变更列表取自相邻标签之间的提交，避免 Release 说明只剩一行 compare 链接。
          $prev = ''
          git describe --tags --abbrev=0 "$($env:TAG)^" *> $null
          if ($LASTEXITCODE -eq 0) { $prev = (git describe --tags --abbrev=0 "$($env:TAG)^").Trim() }
          $range = if ($prev) { "$prev..$($env:TAG)" } else { $env:TAG }
          $changes = @(git log --no-merges --pretty=format:'- %s' $range)
          if ($changes.Count -eq 0) { $changes = @('- 维护性改动') }

          $lines = @(
            "## Lume $($env:VER)"
            ''
            '### 变更'
            ($changes -join "`n")
            ''
            '### 安装'
            ('下载 `Lume-' + $env:VER + '-win64.zip`，解压后双击 `Install.cmd`。Windows 11 22H2（build 22621）及以上 x64，免安装、免管理员。')
            ''
            '校验值见 `SHA256SUMS.txt`。'
          )
          if ($env:GITHUB_REPOSITORY) {
            $link = if ($prev) { "https://github.com/$($env:GITHUB_REPOSITORY)/compare/$prev...$($env:TAG)" } else { "https://github.com/$($env:GITHUB_REPOSITORY)/commits/$($env:TAG)" }
            $lines += ''
            $lines += "**Full Changelog**: $link"
          }
          $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          Set-Content -LiteralPath $notesFile -Value ($lines -join "`n") -Encoding utf8

          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $env:TAG 已存在，覆盖资源与说明"
            gh release upload $env:TAG @assets --clobber
            gh release edit $env:TAG --notes-file $notesFile
          } else {
            gh release create $env:TAG @assets --verify-tag --title "Lume $($env:VER)" --notes-file $notesFile
          }
          gh release view $env:TAG --json url,tagName,assets --jq '"release: " + .url'
